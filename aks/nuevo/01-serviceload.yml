apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: ingress-basic
spec:
  type: LoadBalancer
  loadBalancerIP: ""  # deja vacío para IP dinámica, o fija una IP reservada en Azure
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
  selector:
    app.kubernetes.io/name: ingress-nginx